[project]
name = "mobile-appium-project"
version = "0.1.0"
description = "Типовой проект автоматизации мобильного тестирования на Appium + Python"
requires-python = ">=3.10"
dependencies = [
    "Appium-Python-Client>=4.0.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-rerunfailures>=14.0",
    "allure-pytest>=2.13.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[tool.poetry]
packages = [{ include = "src" }]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --alluredir=reports/allure-results"
markers = [
    "android: тесты для платформы Android",
    "ios: тесты для платформы iOS",
    "smoke: дымовые тесты",
]

[tool.ruff]
line-length = 100
target-version = "py310"
